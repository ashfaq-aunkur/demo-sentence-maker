version: "3.9"
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh     # <-- Add this line
    entrypoint: ["/entrypoint.sh"]         # <-- Add this line
    # Optional but recommended
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sentence-making-api
    ports:
      - "3000:3000"
    depends_on:
      ollama:
        condition: service_healthy        # Better waiting
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  ollama_data: